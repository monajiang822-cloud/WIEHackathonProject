<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/index.css">
    <style>
      body { padding-top: 60px; }
      .form-control, .form-select { margin-bottom: 10px; }
      .workout-result { min-height: 400px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-primary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img src="/static/assets/logo.png" alt="Logo" height="40"/>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/recipies">Recipies</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="/workout">Workouts</a></li>
            <li class="nav-item"><a class="nav-link" href="/forum">Forum</a></li>
            <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Banner -->
    <div class="container-fluid p-0">
      <img src="/static/assets/workout.png" alt="Workout Banner" class="img-fluid w-100" />
    </div>

    <h1 class="mt-4 text-center">Workout</h1>

    <div class="container d-flex flex-row flex-wrap mt-3">
      <!-- Form to generate workout -->
      <form action="/workout" method="post" class="col-md-6 m-2">
        <div class="row g-2">
          <label for="burn-goal">Calorie Burn Goal:</label>
          <select name="burn_goal" class="form-select">
            <option selected>--select--</option>
            <option value="genFromRecipe">Generate From Recipe</option>
            <option value="custom">Custom</option>
          </select>

          <label for="workouttype">Type of Workout:</label>
          <select name="workouttype" class="form-select">
            <option selected>--select--</option>
            <option value="HIIT">HIIT</option>
            <option value="LowIntes">Low Intensity</option>
            <option value="Nature">Nature</option>
            <option value="Dance">Dance</option>
            <option value="UpBody">Upper Body</option>
            <option value="LowBody">LowerBody</option>
            <option value="pilates">Pilates</option>
            <option value="Reccomended">Reccomended</option>
            <option value="Custom">Custom</option>
          </select>

          <label for="difficulty">Difficulty:</label>
          <select name="difficulty" class="form-select">
            <option selected>--select--</option>
            <option value="Low">Low</option>
            <option value="Med">Med</option>
            <option value="High">High</option>
          </select>

          <label for="time">Timer:</label>
          <input type="text" name="time" pattern="[0-9]{1,2}:[0-9]{2}" placeholder="eg. mm:ss" class="form-control"/>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Generate Workout</button>
      </form>

      <!-- Display GPT response -->
      <div class="col m-2">
        <h3>Workout Result</h3>
        <div class="workout-result p-3 bg-light border rounded">
          {% if workout_response %}
            <pre>{{ workout_response }}</pre>
          {% else %}
            <p class="text-muted">Your workout will appear here after clicking "Generate Workout".</p>
          {% endif %}
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
