<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Diet Buddy - Recipies</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/static/index.css" />
    <title>Recipies - Diet Buddy</title>
    <style>
    .workout-result {
      height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
  </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img src="/static/assets/logo.png" alt="Logo" height="40"/>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Recipies</a></li>
            <li class="nav-item"><a class="nav-link" href="/workout">Workouts</a></li>
            <li class="nav-item"><a class="nav-link" href="/forum">Forum</a></li>
            <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid p-0">
      <img src="/static/assets/recipe.png" alt="Recipe Banner" class="img-fluid w-100" />
    </div>

    <h1 class="mt-4 text-center">Recipies</h1>

    <div class="container d-flex flex-row flex-wrap mt-3">
      <!-- Form to generate recipe -->
      <form action="/recipies" method="post" class="col-md-6 m-2">
        <div class="row g-2">
          <label for="restric">Dietary Restrictions:</label>
          <input type="text" name="restric" class="form-control" placeholder="e.g., vegetarian, gluten-free" />
          <label for="fridge">Ingredients you have:</label>
          <input type="text" name="fridge" class="form-control" placeholder="e.g., chicken, broccoli" />
          <label for="genre">Cuisine/Genre:</label>
          <input type="text" name="genre" class="form-control" placeholder="e.g., Italian, Indian" />
          <label for="servings"># of Servings:</label>
          <input type="number" name="servings" min="1" class="form-control" value="1" />
        </div>
        <button type="submit" class="btn btn-primary mt-3">Generate Recipe</button>
      </form>

      <!-- Display GPT response -->
      <div class="col m-2">
        <h3>Recipe Result</h3>
        <div class="workout-result p-3 bg-light border rounded">
          {% if gpt_response %}
            </pre>{{ gpt_response }}</pre>
          {% else %}
            <p class="text-muted">Your recipe will appear here after you click "Generate Recipe".</p>
          {% endif %}
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
