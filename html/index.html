<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diet Buddy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/index.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">
        <img src="/static/assets/logo.png" alt="Diet Buddy Logo" height="40"/>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/recipies">Recipies</a></li>
          <li class="nav-item"><a class="nav-link" href="/workout">Workouts</a></li>
          <li class="nav-item"><a class="nav-link" href="/forum">Forum</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Banner -->
  <div class="container-fluid p-0">
    <img src="/static/assets/banner.png" alt="Banner" class="img-fluid w-100">
  </div>

  <!-- Welcome & Form -->
  <div class="container my-4">
    <h1>Welcome to Diet Buddy</h1>
    <h2>Please input your info for a demo!</h2>
    <form action="/submit" method="post" class="d-flex flex-column col-md-6">
      <label>Full Name:</label>
      <input type="text" name="Name" class="form-control" required>

      <label>Gender:</label>
      <input type="text" name="gender" class="form-control" required>

      <label>Age:</label>
      <input type="number" name="age" class="form-control" required>

      <label>Height:</label>
      <input type="text" name="height" class="form-control" required>

      <label>Weight:</label>
      <input type="text" name="weight" class="form-control" required>

      <label>Medical Issues:</label>
      <input type="text" name="issues" class="form-control">

      <div class="mt-3">
        <a href="/recipies" class="btn btn-primary me-2">Generate Recipies</a>
        <a href="/workout" class="btn btn-primary">Generate Workouts</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
